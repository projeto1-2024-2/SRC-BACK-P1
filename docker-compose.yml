services:
  api_p1:
    container_name: src-back-p1
    build: ./
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - 8088:3005
    depends_on:
      - pgsql_p1
    volumes:
      - .:/usr/src/app_dev
      - /usr/src/app_dev/node_modules
    networks:
      - ondeacho
    command: npm run start:dev
    
  pgsql_p1:
    image: postgres
    container_name: pgsql_p1
    restart: always
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5437:5432
    networks:
      - ondeacho

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.0
    container_name: elastic_p1
    restart: unless-stopped
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - discovery.type=single-node
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          cpus: '0.0001'
          memory: 20M
    volumes:
      - esdata:/usr/share/elasticsearch/data
  kibana:
    image: docker.elastic.co/kibana/kibana:7.10.0
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  logstash:
    container_name: logstash
    restart: unless-stopped
    build:
      context: ./logstash/
      dockerfile: Dockerfile
    environment:
      - LOGSTASH_JAVA_OPTS=-Xmx1g -Xms1g
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - CONFIG_SUPPORT_ESCAPE=true
    ports:
      - "5001:5000"  
    volumes:
      - ./src/config/logstash.conf:/usr/share/logstash/config/logstash.conf
      - logstashvolume:/usr/share/logstash/data
    depends_on:
      - elasticsearch 

networks:
  ondeacho:
    name: ondeacho
    external: true
    

volumes:
  postgres:
  logstashvolume:
  esdata:
    driver: local