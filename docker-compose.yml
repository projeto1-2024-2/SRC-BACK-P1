services:
  postgres:
    image: postgres
    container_name: pgsql_p1_dev
    restart: always
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '5436:5432'
    networks:
      - onde_acho_network

networks:
  onde_acho_network:

volumes:
  postgres: