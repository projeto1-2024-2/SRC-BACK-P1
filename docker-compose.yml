services:
  api_p1:
    container_name: src-back-p1
    build: ./
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - 8088:3005
    depends_on:
      - pgsql_p1
    volumes:
      - .:/usr/src/app_dev
      - /usr/src/app_dev/node_modules
    networks:
      - ondeacho
    command: npm run start:dev
    
  pgsql_p1:
    image: postgres
    container_name: pgsql_p1
    restart: always
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5437:5432
    networks:
      - ondeacho

networks:
  ondeacho:
    name: ondeacho
    external: true
    

volumes:
  postgres: